<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<title>跨文件调用图 __TITLE__</title>
<style>
 html,body{margin:0;height:100%;background:#0a0e0d;color:#dfe;font:13px/1.4 system-ui,sans-serif;overflow:hidden}
 #bar{position:fixed;top:0;left:0;right:0;padding:6px 12px;background:#0f1614;border-bottom:1px solid #1c2a26;font-size:12px;color:#9fb}
 #legend{position:fixed;top:36px;left:8px;font-size:11px;line-height:1.9}
 #legend .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
 #tip{position:fixed;pointer-events:none;background:#132018;border:1px solid #58a;padding:4px 8px;border-radius:4px;font-size:12px;display:none;white-space:pre;z-index:9}
</style></head><body>
<div id="bar">__STATS__</div>
<div id="legend">__LEGEND__</div>
<div id="tip"></div>
<canvas id="cv"></canvas>
<script>
var DATA=__DATA__;
var N=DATA.nodes, E=DATA.edges;
var cv=document.getElementById('cv'), ctx=cv.getContext('2d');
var alpha=1, drag=-1, hover=-1, mx=0, my=0;
function fit(){cv.width=innerWidth;cv.height=innerHeight;}
fit();
addEventListener('resize', function(){fit();draw();});
var incident={};
E.forEach(function(e){
  (incident[e[0]]=incident[e[0]]||[]).push(e);
  (incident[e[1]]=incident[e[1]]||[]).push(e);
});
N.forEach(function(n,i){
  var ang=2*Math.PI*i/Math.max(N.length,1);
  var R=Math.max(130, 80+10*Math.sqrt(N.length));
  n.x=cv.width/2+R*Math.cos(ang);
  n.y=cv.height/2+R*Math.sin(ang);
  n.vx=0; n.vy=0;
  n.r=6+Math.min(n.deg,14)*0.6;
});
function hit(x,y){
  for(var i=N.length-1;i>=0;i--){
    var n=N[i], dx=x-n.x, dy=y-n.y;
    if(dx*dx+dy*dy<=(n.r+4)*(n.r+4)) return i;
  }
  return -1;
}
function tick(){
  if(alpha<0.004){draw();return;}
  var i,j,a,b;
  for(i=0;i<N.length;i++)for(j=i+1;j<N.length;j++){
    a=N[i];b=N[j];
    var dx=a.x-b.x, dy=a.y-b.y, d2=dx*dx+dy*dy;
    if(d2<1){dx=Math.random()-0.5;dy=Math.random()-0.5;d2=dx*dx+dy*dy||1;}
    var d=Math.sqrt(d2), rep=1700/d*alpha;
    a.vx+=dx/d*rep; a.vy+=dy/d*rep;
    b.vx-=dx/d*rep; b.vy-=dy/d*rep;
  }
  E.forEach(function(e){
    var s=N[e[0]], t=N[e[1]];
    var dx=t.x-s.x, dy=t.y-s.y, d=Math.sqrt(dx*dx+dy*dy)||1;
    var f=(d-95)*0.02*Math.min(e[2]||1,3)*alpha;
    s.vx+=dx/d*f; s.vy+=dy/d*f;
    t.vx-=dx/d*f; t.vy-=dy/d*f;
  });
  for(i=0;i<N.length;i++){a=N[i];
    a.vx=(a.vx+(cv.width/2-a.x)*0.004)*0.86;
    a.vy=(a.vy+(cv.height/2-a.y)*0.003)*0.86;
    if(i===drag){a.x=mx;a.y=my;a.vx=0;a.vy=0;}
    else{a.x+=a.vx;a.y+=a.vy;}
  }
  alpha*=0.992;
  draw();
  requestAnimationFrame(tick);
}
function draw(){
  ctx.fillStyle='#0a0e0d'; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.lineWidth=1;
  E.forEach(function(e){
    var s=N[e[0]], t=N[e[1]];
    var dim=(hover>=0&&e[0]!==hover&&e[1]!==hover)?0.07:0.5;
    ctx.strokeStyle='rgba(95,135,120,'+dim+')';
    ctx.beginPath(); ctx.moveTo(s.x,s.y); ctx.lineTo(t.x,t.y); ctx.stroke();
    var dx=t.x-s.x, dy=t.y-s.y, d=Math.sqrt(dx*dx+dy*dy)||1;
    var ux=dx/d, uy=dy/d;
    var ex=t.x-ux*(t.r+2), ey=t.y-uy*(t.r+2);
    ctx.fillStyle='rgba(125,175,155,'+Math.min(dim+0.15,0.8)+')';
    ctx.beginPath();
    ctx.moveTo(ex,ey);
    ctx.lineTo(ex-ux*5-uy*2.6, ey-uy*5+ux*2.6);
    ctx.lineTo(ex-ux*5+uy*2.6, ey-uy*5-ux*2.6);
    ctx.closePath(); ctx.fill();
  });
  ctx.textAlign='center'; ctx.textBaseline='top';
  ctx.font='11px system-ui,sans-serif';
  N.forEach(function(n,i){
    var dimn=1;
    if(hover>=0&&hover!==i){
      var inc=incident[hover]||[];
      var linked=inc.some(function(e){return e[0]===i||e[1]===i;});
      if(!linked) dimn=0.25;
    }
    ctx.globalAlpha=dimn;
    ctx.fillStyle=n.color;
    ctx.strokeStyle=(hover===i)?'#e8fff4':'#0a0e0d';
    ctx.lineWidth=(hover===i)?2:1;
    ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,6.2832); ctx.fill(); ctx.stroke();
    ctx.fillStyle='rgba(215,235,225,0.85)';
    ctx.fillText(n.label, n.x, n.y+n.r+10);
    ctx.globalAlpha=1;
  });
}
cv.addEventListener('mousemove', function(ev){
  mx=ev.clientX; my=ev.clientY;
  if(drag>=0) return;
  hover=hit(mx,my);
  var tip=document.getElementById('tip');
  if(hover>=0){
    var n=N[hover];
    tip.style.display='block';
    tip.style.left=(mx+14)+'px';
    tip.style.top=(my+10)+'px';
    tip.textContent=n.label+'\n'+n.file+'   (度 '+n.deg+')';
  } else tip.style.display='none';
  draw();
});
cv.addEventListener('mousedown', function(ev){
  mx=ev.clientX; my=ev.clientY;
  drag=hit(mx,my);
  if(drag>=0) alpha=Math.max(alpha,0.3);
});
addEventListener('mouseup', function(){drag=-1;});
cv.addEventListener('mouseleave', function(){
  hover=-1;
  document.getElementById('tip').style.display='none';
  draw();
});
requestAnimationFrame(tick);
</script></body></html>
